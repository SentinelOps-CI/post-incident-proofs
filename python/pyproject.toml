[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "post-incident"
version = "0.1.0"
description = "Offline incident lineage and preservation verification CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.22",
  "referencing>=0.35",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-jsonschema>=4.22",
]

[project.scripts]
post-incident = "post_incident.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["post_incident*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "."
packages = ["post_incident"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
