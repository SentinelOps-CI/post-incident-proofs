name: Bundle Push

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: true
        default: "1.0.0"

jobs:
  build-and-bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Lean
        run: |
          wget https://github.com/leanprover/lean4/releases/download/v4.7.0/lean-4.7.0-linux.tar.gz
          tar -xzf lean-4.7.0-linux.tar.gz
          echo "$PWD/lean-4.7.0-linux/bin" >> $GITHUB_PATH

      - name: Build and verify
        run: |
          lake build
          lake exe tests
          lake exe security
          lake exe observability
          lake exe validate

      - name: Create release artifacts
        run: |
          mkdir -p dist
          tar -czf dist/post-incident-proofs-source.tar.gz src lakefile.lean lean-toolchain README.md
          cp README.md dist/release-notes.txt
          sha256sum dist/post-incident-proofs-source.tar.gz > dist/source.sha256

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name || inputs.version }}
          release_name: Release ${{ github.ref_name || inputs.version }}
          body: |
            ## Post-Incident-Proofs Release ${{ github.ref_name || inputs.version }}

            ### What's included
            - Offline ITE tooling: `post-incident` CLI, Rust digest/DAG kernel, Lean soundness modules
            - PIP domain schemas + vendored PCS integrity pin
            - Legacy Lean executable gates (logging / rate / version / ops) as frozen baseline
            - Source tarball + SHA-256 checksum

            ### Claim boundary
            Structural integrity checks only. Does not claim causation, remediation effectiveness,
            partner-secret contents, live SDE/Morph operation, or production crypto signing services.
            See `docs/adr/PIP-ITE-00-claim-boundary.md` and `docs/adr/ADR-0001-crypto-and-assurance-boundary.md`.

            ### Verification
            ```bash
            pip install -e "./python[dev]"
            post-incident bundle validate fixtures/release/valid_incident_release
            make ite
            # Legacy gates (not lineage evidence):
            make ci
            ```
          draft: false
          prerelease: false

      - name: Upload Source Tarball
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/post-incident-proofs-source.tar.gz
          asset_name: post-incident-proofs-${{ github.ref_name || inputs.version }}-source.tar.gz
          asset_content_type: application/gzip

      - name: Upload Source Checksum
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/source.sha256
          asset_name: post-incident-proofs-${{ github.ref_name || inputs.version }}-source.sha256
          asset_content_type: text/plain

      - name: Upload Release Notes
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/release-notes.txt
          asset_name: release-notes-${{ github.ref_name || inputs.version }}.txt
          asset_content_type: text/plain

      - name: Notify Success
        if: success()
        run: |
          echo "Bundle push completed successfully."
          echo "Release: ${{ steps.create_release.outputs.upload_url }}"
          echo "Source: post-incident-proofs-${{ github.ref_name || inputs.version }}-source.tar.gz"
