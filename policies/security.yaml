name: "Post-Incident-Proofs Security Policy"
version: "1.1.0"
type: "security"
description: >
  Required security controls for this repository. Language is normative for
  engineering practice, not a claim of formal cryptographic proofs.

rules:
  - id: "SEC-001"
    description: >
      ITE digests and integrity checks must use real SHA-256 via Rust/Python
      helpers; Lean Utils.Crypto remains a deterministic stub for legacy gates only
      (ADR-0001). Do not present stub crypto as production cryptography.
    severity: "high"
    category: "cryptography"

  - id: "SEC-002"
    description: >
      When HMAC is used for optional runtime/compose paths, keys must be at least
      256 bits and supplied via environment or untracked key files — never committed.
    severity: "critical"
    category: "key-management"

  - id: "SEC-003"
    description: >
      If public network endpoints are exposed (e.g. optional compose services),
      rate limiting or equivalent abuse controls are required. Legacy lake rate
      gates do not replace deployment controls.
    severity: "medium"
    category: "rate-limiting"

  - id: "SEC-004"
    description: >
      Log integrity / tamper-detection checks that ship as legacy lake executables
      must remain green in CI. Performance budgets are CI completion targets, not
      published product SLAs.
    severity: "high"
    category: "logging"

  - id: "SEC-005"
    description: >
      Incident release bundles must verify declared digests, schemas, and checksums
      via post-incident bundle validate. This is integrity verification of declared
      material, not a claim of cryptographic signing or non-repudiation services.
    severity: "critical"
    category: "bundle-security"

  - id: "SEC-006"
    description: >
      Public fixtures, docs, and CI logs must not contain partner secrets or
      protected plaintext (PIP-ITE-00).
    severity: "critical"
    category: "privacy"
