[package]
name = "post-incident-kernel"
version = "0.1.0"
edition = "2021"
description = "PIP-ITE digest, envelope, and DAG kernel"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
